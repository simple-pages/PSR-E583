        // =========================================================================

        let voices = [];

        // Simple CSV Parser
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const data = [];
            // Skip header row (i = 1)
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const [no, type, name] = lines[i].split(',');
                data.push({
                    no: no ? no.trim() : '',
                    type: type ? type.trim() : '',
                    name: name ? name.trim() : ''
                });
            }
            return data;
        }

        // Render table rows dynamically
        function renderList(items) {
            const tbody = document.getElementById('voiceListBody');
            const noResults = document.getElementById('noResults');
            tbody.innerHTML = '';

            if (items.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            const fragment = document.createDocumentFragment();

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-no">${item.no}</td>
                    <td class="col-type">${item.type}</td>
                    <td class="col-name">${item.name}</td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }

        // Wildcard search function across all 3 fields
        function filterList() {
            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            
            if (!query) {
                renderList(voices);
                return;
            }

            const filtered = voices.filter(item => 
                item.no.toLowerCase().includes(query) ||
                item.type.toLowerCase().includes(query) ||
                item.name.toLowerCase().includes(query)
            );

            renderList(filtered);
        }

        // Initial setup on page load
        document.addEventListener('DOMContentLoaded', () => {
            voices = parseCSV(rawCsvData);
            renderList(voices);
        });
    </script>
